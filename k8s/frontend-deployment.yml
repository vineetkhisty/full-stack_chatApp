apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chat-app
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-chatapp
        image: vineetk2008/chatapp-frontend:latest
        ports:
        - containerPort: 80
        env:
         - name: NODE_ENV
           value: production
