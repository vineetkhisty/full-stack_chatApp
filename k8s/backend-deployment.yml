apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chat-app
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: chatapp-backend
        image: vineetk2008/chatapp-backend:latest
        
        ports:
        - containerPort: 5001
        env:
        - name: NODE_ENV
          value: production
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongosecret
              key: mongouri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mongosecret
              key: jwt
        - name: PORT
          value: "5001"
